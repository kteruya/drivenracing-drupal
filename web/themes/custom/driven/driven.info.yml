name: Driven Racing
type: theme
description: 'Driven Racing custom front-end theme. Bootstrap5 sub-theme. Replaces DXPR.'
# Version: 1.2.0
#
# Changelog:
 * 2026-05-01 16:56 (v1.2.0) Add home page section regions: home_slider, home_embrace, home_featured, home_new_products — render outside Bootstrap container for full-width section backgrounds
# 2026-05-01 17:00 (v1.2.0) Added home page section regions: home_slider,
#                            home_embrace, home_featured, home_new_products.
#                            These render outside Bootstrap container to allow
#                            full-width backgrounds with boxed inner content.
# 2026-04-29 21:00 (v1.1.0) Removed unused regions. Added footer region.
#                            Cleaned to 5 active regions only.
# 2026-04-29 00:00 (v1.0.0) Initial theme. Bootstrap5 sub-theme replacing DXPR.
core_version_requirement: ^10 || ^11
base theme: bootstrap5

# Global libraries loaded on every page
libraries:
  - driven/global

# Regions matching D7 Stability/Driven layout
regions:
  page_top: 'Page top'
  page_bottom: 'Page bottom'
  header: Header
  home_slider: 'Home Slider'
  home_embrace: 'Home Embrace'
  home_featured: 'Home Featured'
  home_new_products: 'Home New Products'
  content: Content
  footer: Footer
